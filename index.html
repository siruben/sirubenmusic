<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#02040f">
<meta name="color-scheme" content="dark">
<meta name="description" content="Leitor de música em néon com playlists, visualizador e modo Hilux.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Siruben Music">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); background: #02040f; }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
<title>Siruben Music</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: ecrã único de telemóvel, 3 separadores (Agora, Biblioteca, Playlists) + mini-player; modo Hilux acrescenta cenário de estrada animado */
:root {
  --bg: #02040f;
  --bg2: #070d2a;
  --panel: #0b1438;
  --panel2: #101c4d;
  --line: #1a2d7a;
  --blue: #2fa8ff;
  --blue-hot: #8ad8ff;
  --blue-deep: #2150ff;
  --fg: #e8f4ff;
  --mute: #7f98c9;
  --amber: #ffb62e;
  --pink: #ff3df0;
  --violet: #a066ff;
  --cyan: #19f2ff;
  --lime: #b8ff3a;
  --danger: #ff5d7a;
  --lvl: 0;
  --f-display: "Bungee", "Impact", sans-serif;
  --f-body: "Barlow", system-ui, sans-serif;
  --f-cond: "Barlow Condensed", "Arial Narrow", sans-serif;
  --f-mono: ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 500 16px/1.4 var(--f-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
  overflow: hidden;
}
body::before {
  content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(120% 60% at 50% -10%, rgba(33,80,255,.35), transparent 60%),
    radial-gradient(60% 40% at 100% 100%, rgba(255,61,240,.20), transparent 70%),
    radial-gradient(60% 40% at 0% 60%, rgba(25,242,255,.12), transparent 70%),
    radial-gradient(80% 50% at 50% 110%, rgba(47,168,255,.18), transparent 70%);
}
body.hilux::before {
  background:
    radial-gradient(90% 50% at 50% 100%, rgba(255,182,46,.22), transparent 65%),
    radial-gradient(120% 60% at 50% -10%, rgba(33,80,255,.45), transparent 60%);
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible, input:focus-visible, label:focus-within, [tabindex]:focus-visible {
  outline: 2px solid var(--blue-hot); outline-offset: 2px; border-radius: 8px;
}
svg.i { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
svg.i.fill { fill: currentColor; stroke: none; }

.app { position: relative; z-index: 1; height: 100%; display: flex; flex-direction: column; max-width: 560px; margin: 0 auto; }

/* Cabeçalho */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 14px; padding-bottom: 6px; }
.brand { font: 400 22px/1 var(--f-display); letter-spacing: .02em; white-space: nowrap;
  background: linear-gradient(90deg, var(--cyan), var(--blue-hot) 45%, var(--pink)); -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 0 8px rgba(47,168,255,.8)) drop-shadow(0 0 18px rgba(255,61,240,.5)); }
body.hilux .brand { background: linear-gradient(90deg, var(--amber), var(--pink) 50%, var(--cyan)); -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 0 8px rgba(255,182,46,.7)) drop-shadow(0 0 18px rgba(25,242,255,.5)); }
.skin {
  display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px; border-radius: 999px;
  border: 1px solid var(--line); background: rgba(11,20,56,.7); font: 600 13px var(--f-cond); letter-spacing: .08em; text-transform: uppercase; color: var(--mute);
}
.skin .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--blue); box-shadow: 0 0 8px var(--blue); }
body.hilux .skin { color: var(--amber); border-color: rgba(255,182,46,.5); }
body.hilux .skin .dot { background: var(--amber); box-shadow: 0 0 8px var(--amber); }

/* Vistas */
.views { flex: 1; min-height: 0; position: relative; }
.view { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; padding-bottom: 12px; scrollbar-width: none; }
.view::-webkit-scrollbar { display: none; }

/* Ecrã Agora */
.now { display: flex; flex-direction: column; align-items: center; gap: 14px; }
.stage { position: relative; width: min(64vw, 300px, 38vh); aspect-ratio: 1; margin-top: 4px; max-width: 100%; }
.halo { position: absolute; inset: -14%; border-radius: 50%;
  background: radial-gradient(closest-side, rgba(47,168,255,calc(.25 + var(--lvl) * .55)), rgba(255,61,240,calc(.08 + var(--lvl) * .25)) 55%, transparent 74%);
  transform: scale(calc(1 + var(--lvl) * .12)); transition: transform .08s linear;
  animation: hue 10s linear infinite; animation-play-state: paused; }
.disc {
  position: absolute; inset: 0; border-radius: 50%;
  background:
    radial-gradient(circle at 50% 50%, transparent 0 27%, rgba(0,0,0,.55) 27.5% 28.5%, transparent 29%),
    repeating-radial-gradient(circle at 50% 50%, #050a22 0 2px, #0a1442 2px 4px),
    conic-gradient(from 20deg, rgba(25,242,255,0), rgba(25,242,255,.45), rgba(160,102,255,0) 30%, rgba(255,61,240,0) 48%, rgba(255,61,240,.42) 68%, rgba(160,102,255,0) 82%, rgba(25,242,255,0));
  border: 2px solid var(--blue);
  box-shadow: 0 0 0 1px rgba(138,216,255,.4), 0 0 22px var(--blue), 0 0 54px rgba(160,102,255,.6), 0 0 90px rgba(255,61,240,.35), inset 0 0 30px rgba(47,168,255,.35);
  animation: spin 7s linear infinite; animation-play-state: paused;
}
body.playing .disc { animation-play-state: running; }
.label { position: absolute; inset: 31%; border-radius: 50%; display: grid; place-items: center;
  background: radial-gradient(circle at 35% 30%, var(--cyan), var(--blue-deep) 58%, var(--violet));
  box-shadow: 0 0 18px var(--blue); font: 400 clamp(20px, 6vw, 32px)/1 var(--f-display); color: #02040f; }
body.hilux .label { background: radial-gradient(circle at 35% 30%, #ffe3a0, var(--amber) 70%); box-shadow: 0 0 18px var(--amber); }
.label::after { content: ""; position: absolute; width: 9%; aspect-ratio: 1; border-radius: 50%; background: var(--bg); }
.label span { position: relative; z-index: 1; }
.label::after { z-index: 2; }
@keyframes spin { to { transform: rotate(360deg); } }

#viz { width: 100%; height: 56px; display: block; }
.meta { text-align: center; width: 100%; min-width: 0; }
.meta .t { font: 700 24px/1.15 var(--f-cond); letter-spacing: .02em; overflow-wrap: anywhere; text-wrap: balance;
  text-shadow: 0 0 14px rgba(47,168,255,.5); }
.meta .a { font: 500 14px var(--f-cond); letter-spacing: .14em; text-transform: uppercase; color: var(--mute); margin-top: 2px; }

.seek { width: 100%; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; font: 500 13px var(--f-mono); color: var(--mute); font-variant-numeric: tabular-nums; }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 28px; background: transparent; margin: 0; }
input[type=range]::-webkit-slider-runnable-track { height: 6px; border-radius: 6px;
  background: linear-gradient(90deg, var(--cyan), var(--blue) calc(var(--p, 0%) * .55), var(--pink) var(--p, 0%), var(--panel2) var(--p, 0%)); box-shadow: 0 0 10px rgba(47,168,255,.4); }
input[type=range]::-moz-range-track { height: 6px; border-radius: 6px; background: var(--panel2); }
input[type=range]::-moz-range-progress { height: 6px; border-radius: 6px; background: var(--blue); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; margin-top: -7px; border-radius: 50%;
  background: var(--blue-hot); box-shadow: 0 0 0 4px rgba(47,168,255,.25), 0 0 14px var(--blue); border: 0; }
input[type=range]::-moz-range-thumb { width: 20px; height: 20px; border-radius: 50%; background: var(--blue-hot); border: 0; box-shadow: 0 0 14px var(--blue); }

.ctrls { display: flex; align-items: center; justify-content: space-between; width: 100%; max-width: 380px; }
.ib { width: 48px; height: 48px; display: grid; place-items: center; border-radius: 50%; color: var(--fg); transition: transform .12s, color .15s, background .15s; }
.ib:active { transform: scale(.9); }
.ib.on { color: var(--blue-hot); background: rgba(47,168,255,.14); filter: drop-shadow(0 0 6px var(--blue)); }
.ib.sm { width: 40px; height: 40px; }
.ib.danger { color: var(--danger); }
.play { width: 74px; height: 74px; border-radius: 50%; display: grid; place-items: center; color: #02040f;
  background: radial-gradient(circle at 35% 30%, #c8f6ff, var(--cyan) 35%, var(--blue) 65%, var(--violet));
  box-shadow: 0 0 0 2px rgba(138,216,255,.5), 0 0 22px var(--cyan), 0 0 46px rgba(160,102,255,.8), 0 0 80px rgba(255,61,240,.45); transition: transform .12s; }
.play:active { transform: scale(.93); }
.play svg { width: 32px; height: 32px; }
body.playing .play { animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 2px rgba(138,216,255,.7), 0 0 34px var(--cyan), 0 0 70px rgba(160,102,255,.9), 0 0 110px rgba(255,61,240,.6); } }
.rep1 { position: relative; }
.rep1 b { position: absolute; right: 8px; top: 8px; font: 700 10px var(--f-mono); color: var(--blue-hot); }

.vol { width: 100%; max-width: 380px; display: flex; align-items: center; gap: 8px; color: var(--mute); }
.vol svg { width: 20px; height: 20px; }

/* Cenário Hilux */
.scene { display: none; width: 100%; border-radius: 18px; overflow: hidden; border: 1px solid rgba(255,61,240,.55);
  box-shadow: 0 0 18px rgba(255,61,240,.35), 0 0 40px rgba(25,242,255,.18); }
body.hilux .scene { display: block; order: -1; }
.scene svg { width: 100%; height: auto; display: block; }
.scene .tag { font: 400 8px var(--f-display); letter-spacing: .14em; fill: #ffe3a0; }
.scene .bubble text { font: 400 10px var(--f-display); fill: #2a0f3a; }
body.hilux .stage { width: min(46vw, 220px, 26vh); }
.cover-row { display: none; gap: 8px; align-items: center; justify-content: center; flex-wrap: wrap; }
body.hilux .cover-row { display: flex; }
.label.has-img span { display: none; }
.scene { position: relative; aspect-ratio: 2 / 1; background: #02040f; }
.scene video { width: 100%; height: 100%; display: block; object-fit: cover; object-position: 50% 55%; }
.scene .cap { position: absolute; left: 0; right: 0; bottom: 0; padding: 22px 10px 7px; text-align: center; pointer-events: none;
  background: linear-gradient(to top, rgba(2,4,15,.9), rgba(2,4,15,0));
  font: 400 12px/1 var(--f-display); letter-spacing: .12em; color: #ffe3a0;
  text-shadow: 0 0 8px var(--pink), 0 0 16px var(--pink); }
body.hilux .now { gap: 12px; }
body.hilux .stage { width: min(32vw, 125px, 16vh); }
body.hilux #viz { height: 40px; }
.road-dash { stroke-dasharray: 18 16; animation: road .5s linear infinite; animation-play-state: paused; }
body.playing .road-dash { animation-play-state: running; }
@keyframes road { to { stroke-dashoffset: 34; } }
.wheel { transform-box: fill-box; transform-origin: center; animation: spin .6s linear infinite; animation-play-state: paused; }
body.playing .wheel { animation-play-state: running; }
.truck { animation: bounce .55s ease-in-out infinite; animation-play-state: paused; }
body.playing .truck { animation-play-state: running; }
@keyframes bounce { 50% { transform: translateY(-1.6px); } }
.beam { opacity: calc(.35 + var(--lvl) * .65); }
.stars { animation: tw 3s ease-in-out infinite alternate; }
@keyframes tw { from { opacity: .4; } to { opacity: 1; } }

/* Listas */
.head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 0 10px; }
.head h2 { margin: 0; font: 700 26px/1 var(--f-cond); letter-spacing: .04em; text-transform: uppercase; text-shadow: 0 0 14px rgba(47,168,255,.55); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 42px; padding: 0 16px; border-radius: 999px;
  font: 700 14px var(--f-cond); letter-spacing: .1em; text-transform: uppercase; color: #02040f;
  background: linear-gradient(100deg, var(--cyan), var(--blue) 55%, var(--violet)); box-shadow: 0 0 18px rgba(47,168,255,.55), 0 0 30px rgba(255,61,240,.3); cursor: pointer; }
.btn:active { transform: scale(.96); }
.btn.ghost { color: var(--blue-hot); background: transparent; border: 1px solid var(--line); box-shadow: none; }
.btn svg { width: 18px; height: 18px; }
.search { width: 100%; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: rgba(11,20,56,.8); color: var(--fg); padding: 0 14px; font: 500 16px var(--f-body); margin-bottom: 10px; }
.search::placeholder { color: var(--mute); }
.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.row { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; padding: 8px 8px 8px 10px; border-radius: 12px;
  background: rgba(11,20,56,.65); border: 1px solid transparent; min-width: 0; }
.row.cur { border-color: var(--blue); box-shadow: 0 0 14px rgba(47,168,255,.35), inset 0 0 14px rgba(47,168,255,.12); }
.row .n { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; background: var(--panel2); color: var(--blue-hot); font: 600 13px var(--f-mono); }
.row.cur .n { background: var(--blue); color: #02040f; }
.row .tx { min-width: 0; text-align: left; }
.row .tx b { display: block; font: 600 17px/1.2 var(--f-cond); letter-spacing: .02em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .tx small { display: block; color: var(--mute); font: 500 12px var(--f-mono); }
.row .acts { display: flex; }
.empty { text-align: center; color: var(--mute); padding: 36px 12px; display: grid; gap: 14px; justify-items: center; }
.empty p { margin: 0; max-width: 30ch; }
.note { font: 500 12px var(--f-mono); color: var(--amber); padding: 8px 0; }

.pl { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 14px; width: 100%; text-align: left;
  background: linear-gradient(135deg, rgba(33,80,255,.28), rgba(11,20,56,.7)); border: 1px solid var(--line); }
.pl b { font: 700 20px var(--f-cond); letter-spacing: .03em; }
.pl small { display: block; color: var(--mute); font: 500 12px var(--f-mono); }
.inline { display: flex; gap: 8px; margin-bottom: 10px; }
.inline .search { margin: 0; flex: 1; min-width: 0; }
.back { display: inline-flex; align-items: center; gap: 6px; color: var(--blue-hot); font: 700 14px var(--f-cond); letter-spacing: .1em; text-transform: uppercase; min-height: 40px; }

/* Mistura de cores néon: cada item da lista roda por ciano, rosa, violeta e verde */
.list > li:nth-child(4n+1) { --c: var(--cyan); }
.list > li:nth-child(4n+2) { --c: var(--pink); }
.list > li:nth-child(4n+3) { --c: var(--violet); }
.list > li:nth-child(4n+4) { --c: var(--lime); }
.row .n { color: var(--c, var(--blue-hot)); background: color-mix(in srgb, var(--c, var(--blue)) 18%, var(--panel2)); }
.row.cur { border-color: var(--c, var(--blue)); box-shadow: 0 0 14px color-mix(in srgb, var(--c, var(--blue)) 45%, transparent), inset 0 0 14px color-mix(in srgb, var(--c, var(--blue)) 14%, transparent); }
.row.cur .n { background: var(--c, var(--blue)); color: #02040f; }
.row.on .chk { background: var(--c, var(--blue)); border-color: var(--c, var(--blue)); box-shadow: 0 0 10px var(--c, var(--blue)); }
.pl { border-color: color-mix(in srgb, var(--c, var(--blue)) 55%, transparent); box-shadow: 0 0 12px color-mix(in srgb, var(--c, var(--blue)) 25%, transparent); }
.pl b { color: var(--c, var(--fg)); }
body.playing .halo { animation-play-state: running; }
@keyframes hue { to { filter: hue-rotate(360deg); } }

/* Mini-player */
.mini { display: none; align-items: center; gap: 10px; padding: 6px 8px 6px 12px; margin-bottom: 8px; border-radius: 14px;
  background: rgba(16,28,77,.95); border: 1px solid var(--blue); box-shadow: 0 0 18px rgba(47,168,255,.4); }
.mini.show { display: flex; }
.mini .tx { flex: 1; min-width: 0; text-align: left; }
.mini .tx b { display: block; font: 600 16px var(--f-cond); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mini .bar { height: 3px; border-radius: 3px; background: var(--panel); margin-top: 4px; overflow: hidden; }
.mini .bar i { display: block; height: 100%; width: var(--p, 0%); background: var(--blue); box-shadow: 0 0 8px var(--blue); }

/* Separadores */
.tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 6px 0 calc(8px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); }
.tab { display: grid; justify-items: center; gap: 2px; padding: 6px 0; border-radius: 12px; color: var(--mute); font: 700 12px var(--f-cond); letter-spacing: .12em; text-transform: uppercase; }
.tab[aria-selected=true] { color: var(--blue-hot); filter: drop-shadow(0 0 8px var(--blue)); }
.tab[data-tab=now][aria-selected=true] { color: var(--cyan); filter: drop-shadow(0 0 8px var(--cyan)); }
.tab[data-tab=lib][aria-selected=true] { color: var(--pink); filter: drop-shadow(0 0 8px var(--pink)); }
.tab[data-tab=pl][aria-selected=true] { color: var(--lime); filter: drop-shadow(0 0 8px var(--lime)); }

/* Folha para escolher playlist */
.sheet-bg { position: fixed; inset: 0; z-index: 20; background: rgba(2,4,15,.7); display: none; align-items: flex-end; justify-content: center; }
.sheet-bg.show { display: flex; }
.sheet { width: 100%; max-width: 560px; max-height: 75%; overflow-y: auto; background: var(--panel); border: 1px solid var(--blue); border-bottom: 0; border-radius: 20px 20px 0 0;
  padding: 16px max(16px, env(safe-area-inset-left, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)); box-shadow: 0 -10px 40px rgba(47,168,255,.35); animation: up .22s ease-out; }
@keyframes up { from { transform: translateY(30px); opacity: 0; } }
.sheet h3 { margin: 0 0 10px; font: 700 20px var(--f-cond); letter-spacing: .06em; text-transform: uppercase; }
.sheet .row { cursor: pointer; width: 100%; }
.chk { width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--line); display: grid; place-items: center; color: #02040f; }
.row.on .chk { background: var(--blue); border-color: var(--blue); box-shadow: 0 0 10px var(--blue); }
.toast { position: fixed; left: 50%; top: calc(62px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); z-index: 30; padding: 10px 16px; border-radius: 999px;
  background: var(--panel2); border: 1px solid var(--blue); color: var(--fg); font: 600 14px var(--f-cond); letter-spacing: .06em; box-shadow: 0 0 18px rgba(47,168,255,.5); opacity: 0; pointer-events: none; transition: opacity .2s; max-width: 90vw; text-align: center; }
.toast.show { opacity: 1; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

@media (prefers-reduced-motion: reduce) {
  .disc, .road-dash, .wheel, .truck, .stars, body.playing .play, .sheet { animation: none !important; }
  .halo { transition: none; }
}
@media (max-height: 640px) { .stage { width: min(40vw, 200px); } .play { width: 64px; height: 64px; } }
</style>
</head>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">

  <symbol id="i-prev" viewBox="0 0 24 24"><path d="M5 5h2.5v14H5zM20 5v14L9 12z"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><path d="M16.5 5H19v14h-2.5zM4 5v14l11-7z"/></symbol>
  <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></symbol>
  <symbol id="i-repeat" viewBox="0 0 24 24"><path d="M17 2l4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 0 1-3 3H3"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>

<div class="toast" id="toast" role="status"></div>
<script>
(function () {
'use strict';
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const fmt = s => { if (!isFinite(s) || s < 0) return '0:00'; s = Math.floor(s); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const icon = (n, fill) => '<svg class="i' + (fill ? ' fill' : '') + '"><use href="#i-' + n + '"/></svg>';
let toastT;
function toast(m) {
  const t = $('toast'); t.textContent = m; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2200);
}

/* ---------- Armazenamento (IndexedDB, com fallback em memória) ---------- */
const mem = { blobs: new Map(), kv: new Map() };
let db = null, persistent = false;
function openDB() {
  return new Promise((res, rej) => {
    try {
      const r = indexedDB.open('radio-hilux', 1);
      r.onupgradeneeded = () => { r.result.createObjectStore('blobs'); r.result.createObjectStore('kv'); };
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
      r.onblocked = () => rej(new Error('blocked'));
    } catch (e) { rej(e); }
  });
}
function idb(store, mode, fn) {
  return new Promise((res, rej) => {
    const tx = db.transaction(store, mode);
    const rq = fn(tx.objectStore(store));
    tx.oncomplete = () => res(rq && rq.result);
    tx.onerror = () => rej(tx.error);
    tx.onabort = () => rej(tx.error);
  });
}
async function put(store, key, val) {
  if (persistent) { try { await idb(store, 'readwrite', s => s.put(val, key)); mem[store].delete(key); return; } catch (e) { /* cai para memória */ } }
  mem[store].set(key, val);
}
async function get(store, key) {
  if (persistent) { try { const v = await idb(store, 'readonly', s => s.get(key)); if (v !== undefined) return v; } catch (e) { /* ignora */ } }
  return mem[store].get(key);
}
async function del(store, key) {
  if (persistent) { try { await idb(store, 'readwrite', s => s.delete(key)); } catch (e) { /* ignora */ } }
  mem[store].delete(key);
}

/* ---------- Estado ---------- */
const S = {
  tracks: [], playlists: [],
  set: { skin: 'neon', shuffle: false, repeat: 'off', vol: 0.85 },
  queue: [], qi: -1, plView: null, tab: 'now'
};
const byId = id => S.tracks.find(t => t.id === id);
const saveTracks = () => put('kv', 'tracks', S.tracks);
const savePl = () => put('kv', 'playlists', S.playlists);
const saveSet = () => put('kv', 'settings', S.set);

/* ---------- Importar músicas ---------- */
function parseName(fn) {
  const s = fn.replace(/\.[^.]+$/, '').replace(/_/g, ' ').replace(/^\s*\d{1,3}\s*[.\-–]\s*/, '').trim();
  const m = s.split(/\s+[-–]\s+/);
  if (m.length >= 2) return { artist: m[0].trim(), title: m.slice(1).join(' - ').trim() };
  return { artist: '', title: s || fn };
}
function readDuration(f) {
  return new Promise(res => {
    const a = new Audio(); const u = URL.createObjectURL(f); let done = false;
    const end = d => { if (done) return; done = true; URL.revokeObjectURL(u); a.removeAttribute('src'); res(isFinite(d) ? d : 0); };
    a.preload = 'metadata';
    a.onloadedmetadata = () => end(a.duration);
    a.onerror = () => end(0);
    setTimeout(() => end(0), 4000);
    a.src = u;
  });
}
async function importFiles(files) {
  const list = [...files].filter(f => /^audio\//.test(f.type) || /\.(mp3|m4a|aac|wav|ogg|flac|opus)$/i.test(f.name));
  if (!list.length) { toast('Escolhe ficheiros de áudio'); return; }
  let n = 0;
  for (const f of list) {
    if (S.tracks.some(t => t.file === f.name && t.size === f.size)) continue;
    const id = uid(); const p = parseName(f.name);
    toast('A adicionar ' + (n + 1) + ' de ' + list.length + '…');
    const dur = await readDuration(f);
    await put('blobs', id, f);
    S.tracks.push({ id, file: f.name, title: p.title, artist: p.artist, size: f.size, dur, added: Date.now() });
    n++;
  }
  await saveTracks();
  renderLib(); renderPl();
  toast(n ? n + (n === 1 ? ' música adicionada' : ' músicas adicionadas') : 'Essas músicas já estão na biblioteca');
}

/* ---------- Leitor ---------- */
const audio = new Audio();
audio.preload = 'auto';
let curUrl = null, loadTok = 0, dragging = false;
let actx = null, analyser = null, freq = null;

function ensureGraph() {
  if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    const ctx = new AC();
    const an = ctx.createAnalyser();
    an.fftSize = 128; an.smoothingTimeConstant = 0.78;
    const src = ctx.createMediaElementSource(audio);
    src.connect(an); an.connect(ctx.destination);
    actx = ctx; analyser = an; freq = new Uint8Array(an.frequencyBinCount);
  } catch (e) { actx = null; analyser = null; }
}
function shuffleArr(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function startQueue(ids, startId) {
  let q = ids.slice();
  if (!q.length) return;
  if (S.set.shuffle) {
    shuffleArr(q);
    if (startId) { const i = q.indexOf(startId); if (i > 0) { q.splice(i, 1); q.unshift(startId); } }
  }
  S.src = ids.slice();
  S.queue = q;
  S.qi = startId ? Math.max(0, q.indexOf(startId)) : 0;
  loadCurrent(true);
}
function rebuildQueue() {
  if (!S.src || !S.queue.length) return;
  const cur = S.cur;
  let q = S.src.filter(id => byId(id));
  if (S.set.shuffle) {
    shuffleArr(q);
    const i = q.indexOf(cur); if (i > 0) { q.splice(i, 1); q.unshift(cur); }
  }
  S.queue = q; S.qi = Math.max(0, q.indexOf(cur));
}
async function loadCurrent(autoplay) {
  const id = S.queue[S.qi]; const t = byId(id);
  if (!t) { updateNow(); return; }
  const tok = ++loadTok;
  const blob = await get('blobs', id);
  if (tok !== loadTok) return;
  if (!blob) { toast('Ficheiro não encontrado: ' + t.title); return; }
  if (curUrl) URL.revokeObjectURL(curUrl);
  curUrl = URL.createObjectURL(blob);
  audio.src = curUrl; S.cur = id;
  updateNow(); setMedia(t);
  if (autoplay) play();
}
function play() {
  ensureGraph();
  const p = audio.play();
  if (p && p.catch) p.catch(() => toast('Não foi possível tocar esta música'));
}
function toggle() {
  if (!audio.src) {
    if (!S.tracks.length) { toast('Adiciona músicas na biblioteca'); setTab('lib'); return; }
    startQueue(S.tracks.map(t => t.id)); return;
  }
  if (audio.paused) play(); else audio.pause();
}
function next(auto) {
  if (!S.queue.length) return;
  if (auto && S.set.repeat === 'one') { audio.currentTime = 0; play(); return; }
  let i = S.qi + 1;
  if (i >= S.queue.length) {
    if (S.set.repeat === 'all' || !auto) { if (S.set.shuffle) shuffleArr(S.queue); i = 0; }
    else { audio.pause(); audio.currentTime = 0; updateNow(); return; }
  }
  S.qi = i; loadCurrent(true);
}
function prev() {
  if (!S.queue.length) return;
  if (audio.currentTime > 3) { audio.currentTime = 0; return; }
  S.qi = S.qi > 0 ? S.qi - 1 : S.queue.length - 1;
  loadCurrent(true);
}
function setMedia(t) {
  try {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({ title: t.title, artist: t.artist || 'Rádio Hilux' });
    navigator.mediaSession.setActionHandler('play', play);
    navigator.mediaSession.setActionHandler('pause', () => audio.pause());
    navigator.mediaSession.setActionHandler('previoustrack', prev);
    navigator.mediaSession.setActionHandler('nexttrack', () => next(false));
  } catch (e) { /* sem suporte */ }
}
function syncVideo() {
  const v = $('hiluxVid'); if (!v) return;
  if (S.set.skin === 'hilux' && !audio.paused) { const p = v.play(); if (p && p.catch) p.catch(() => {}); }
  else v.pause();
}
function setPlaying(on) {
  document.body.classList.toggle('playing', on);
  const h = on ? '#i-pause' : '#i-play';
  $('playIcon').firstElementChild.setAttribute('href', h);
  $('miniIcon').firstElementChild.setAttribute('href', h);
  $('bPlay').setAttribute('aria-label', on ? 'Pausar' : 'Tocar');
  $('miniPlay').setAttribute('aria-label', on ? 'Pausar' : 'Tocar');
  if (on) startViz();
  syncVideo();
}
function updateNow() {
  const t = byId(S.cur);
  $('curTitle').textContent = t ? t.title : 'Nenhuma música';
  $('curArtist').textContent = t ? (t.artist || (S.set.skin === 'hilux' ? 'Célia e Rubinho' : 'Sem artista')) : 'Adiciona ficheiros na biblioteca';
  $('lbl').textContent = t ? (t.title.trim()[0] || '♪').toUpperCase() : '♪';
  $('miniTitle').textContent = t ? t.title : '—';
  $('mini').classList.toggle('show', !!t && S.tab !== 'now');
  $('tDur').textContent = fmt(audio.duration || (t && t.dur) || 0);
  if (!t) { $('seek').value = 0; $('seek').style.setProperty('--p', '0%'); $('tCur').textContent = '0:00'; setPlaying(false); }
  refreshLists();
}
audio.addEventListener('play', () => setPlaying(true));
audio.addEventListener('pause', () => setPlaying(false));
audio.addEventListener('ended', () => next(true));
audio.addEventListener('error', () => { if (audio.src) toast('Erro ao ler o ficheiro de áudio'); });
audio.addEventListener('loadedmetadata', () => { $('tDur').textContent = fmt(audio.duration); });
audio.addEventListener('timeupdate', () => {
  const d = audio.duration || 0; const p = d ? audio.currentTime / d : 0;
  $('miniBar').style.setProperty('--p', (p * 100).toFixed(1) + '%');
  if (dragging) return;
  $('tCur').textContent = fmt(audio.currentTime);
  $('seek').value = Math.round(p * 1000);
  $('seek').style.setProperty('--p', (p * 100).toFixed(1) + '%');
});
const seekEl = $('seek');
seekEl.addEventListener('input', () => {
  dragging = true;
  const d = audio.duration || 0;
  $('tCur').textContent = fmt(d * seekEl.value / 1000);
  seekEl.style.setProperty('--p', (seekEl.value / 10) + '%');
});
seekEl.addEventListener('change', () => {
  const d = audio.duration || 0;
  if (d) audio.currentTime = d * seekEl.value / 1000;
  dragging = false;
});
const volEl = $('vol');
volEl.addEventListener('input', () => {
  S.set.vol = volEl.value / 100; audio.volume = S.set.vol;
  volEl.style.setProperty('--p', volEl.value + '%');
});
volEl.addEventListener('change', saveSet);

/* ---------- Visualizador ---------- */
const cv = $('viz'), cx = cv.getContext('2d');
const NB = 36, bars = new Float32Array(NB);
let vizOn = false;
function startViz() { if (!vizOn) { vizOn = true; requestAnimationFrame(drawViz); } }
function drawViz(ts) {
  const w = cv.width, h = cv.height, playing = !audio.paused;
  if (analyser && playing) analyser.getByteFrequencyData(freq);
  let peak = 0;
  for (let i = 0; i < NB; i++) {
    let target = 0;
    if (playing) {
      if (analyser) target = Math.pow(freq[2 + Math.floor(i * 1.2)] / 255, 1.25);
      else target = 0.2 + 0.55 * Math.abs(Math.sin(ts / 260 + i * 0.55)) * (0.6 + 0.4 * Math.sin(ts / 97 + i));
    }
    bars[i] += (target - bars[i]) * (target > bars[i] ? 0.55 : 0.18);
    peak = Math.max(peak, bars[i]);
  }
  let low = 0; for (let i = 0; i < 6; i++) low += bars[i];
  document.documentElement.style.setProperty('--lvl', Math.min(1, low / 6 * 1.4).toFixed(3));
  cx.clearRect(0, 0, w, h);
  const hil = S.set.skin === 'hilux';
  cx.shadowBlur = 12;
  const gap = 5, bw = (w - gap * (NB - 1)) / NB;
  for (let i = 0; i < NB; i++) {
    const bh = Math.max(4, bars[i] * h * 0.96);
    const tt = (i / NB + ts / 7000) % 1;
    const hue = 185 + 130 * (1 - Math.abs(2 * tt - 1));
    const col = (hil && i % 6 === 3) ? '#ffb62e' : 'hsl(' + hue.toFixed(0) + ' 100% ' + (hil ? 66 : 62) + '%)';
    cx.fillStyle = col; cx.shadowColor = col;
    const x = i * (bw + gap), y = h - bh, r = Math.min(bw / 2, 5);
    cx.beginPath();
    cx.moveTo(x, h); cx.lineTo(x, y + r); cx.quadraticCurveTo(x, y, x + r, y);
    cx.lineTo(x + bw - r, y); cx.quadraticCurveTo(x + bw, y, x + bw, y + r); cx.lineTo(x + bw, h); cx.closePath();
    cx.fill();
  }
  if (playing || peak > 0.01) requestAnimationFrame(drawViz); else vizOn = false;
}

/* ---------- Biblioteca ---------- */
let armedKey = null, armedT;
function confirmTap(key) {
  if (armedKey === key) { armedKey = null; clearTimeout(armedT); return true; }
  armedKey = key; clearTimeout(armedT); armedT = setTimeout(() => { armedKey = null; }, 3000);
  toast('Toca outra vez para apagar');
  return false;
}
function trackRow(t, n, acts) {
  const cur = S.cur === t.id && !!audio.src;
  const mark = cur ? (audio.paused ? '❚❚' : '▶') : n;
  return '<li class="row' + (cur ? ' cur' : '') + '" data-id="' + t.id + '">' +
    '<span class="n">' + mark + '</span>' +
    '<button class="tx" type="button" data-act="play"><b>' + esc(t.title) + '</b><small>' + esc(t.artist || '—') + ' · ' + fmt(t.dur) + '</small></button>' +
    '<span class="acts">' + acts + '</span></li>';
}
function renderLib() {
  const ul = $('libList');
  if (!S.tracks.length) {
    ul.innerHTML = '<li class="empty"><p>A biblioteca está vazia. Escolhe os MP3 que tens no telemóvel.</p>' +
      '<label class="btn" for="file">' + icon('plus') + 'Adicionar músicas</label></li>';
    return;
  }
  const q = $('q').value.trim().toLowerCase();
  const list = S.tracks.filter(t => !q || (t.title + ' ' + t.artist).toLowerCase().includes(q));
  if (!list.length) { ul.innerHTML = '<li class="empty"><p>Nada encontrado para essa pesquisa.</p></li>'; return; }
  ul.innerHTML = list.map((t, i) => trackRow(t, i + 1,
    '<button class="ib sm" type="button" data-act="add" aria-label="Adicionar a playlist">' + icon('plus') + '</button>' +
    '<button class="ib sm danger" type="button" data-act="del" aria-label="Apagar música">' + icon('trash') + '</button>')).join('');
}
$('q').addEventListener('input', renderLib);
$('libList').addEventListener('click', e => {
  const row = e.target.closest('.row'); const btn = e.target.closest('[data-act]');
  if (!row || !btn) return;
  const id = row.dataset.id;
  if (btn.dataset.act === 'play') {
    const q = $('q').value.trim().toLowerCase();
    const ids = S.tracks.filter(t => !q || (t.title + ' ' + t.artist).toLowerCase().includes(q)).map(t => t.id);
    if (S.cur === id && audio.src) toggle(); else startQueue(ids, id);
  } else if (btn.dataset.act === 'add') {
    openSheet({ type: 'track', id });
  } else if (btn.dataset.act === 'del') {
    if (confirmTap('t' + id)) deleteTrack(id);
  }
});
async function deleteTrack(id) {
  S.tracks = S.tracks.filter(x => x.id !== id);
  S.playlists.forEach(p => { p.ids = p.ids.filter(x => x !== id); });
  S.queue = S.queue.filter(x => x !== id);
  if (S.src) S.src = S.src.filter(x => x !== id);
  if (S.cur === id) {
    loadTok++; audio.pause(); audio.removeAttribute('src');
    if (curUrl) { URL.revokeObjectURL(curUrl); curUrl = null; }
    S.cur = null; S.qi = -1;
  } else if (S.cur) S.qi = S.queue.indexOf(S.cur);
  await del('blobs', id); await saveTracks(); await savePl();
  updateNow(); renderPl(); toast('Música apagada');
}

/* ---------- Playlists ---------- */
S.plNew = false; S.plRename = false;
const plById = id => S.playlists.find(p => p.id === id);
function toggleIn(pid, tid) {
  const p = plById(pid); if (!p) return;
  const i = p.ids.indexOf(tid);
  if (i >= 0) p.ids.splice(i, 1); else p.ids.push(tid);
  savePl();
}
function createPlaylist(name, addTrack) {
  name = name.trim();
  if (!name) { toast('Escreve um nome para a playlist'); return null; }
  const p = { id: uid(), name: name.slice(0, 40), ids: addTrack ? [addTrack] : [] };
  S.playlists.push(p); savePl();
  return p;
}
function renderPl() {
  const root = $('plRoot');
  const p = S.plView ? plById(S.plView) : null;
  if (S.plView && !p) S.plView = null;
  if (p) {
    const tr = p.ids.map(byId).filter(Boolean);
    let h = '<button class="back" type="button" data-act="back">' + icon('back') + 'Playlists</button>';
    h += '<div class="head"><h2>' + esc(p.name) + '</h2><div class="acts">' +
      '<button class="ib sm" type="button" data-act="rename" aria-label="Mudar o nome">' + icon('edit') + '</button>' +
      '<button class="ib sm danger" type="button" data-act="delpl" aria-label="Apagar playlist">' + icon('trash') + '</button></div></div>';
    if (S.plRename) h += '<form class="inline" id="renForm"><input class="search" id="renName" maxlength="40" value="' + esc(p.name) + '" aria-label="Novo nome"><button class="btn" type="submit">Guardar</button></form>';
    h += '<div class="inline"><button class="btn" type="button" data-act="playall">' + icon('play', true) + 'Tocar</button>' +
      '<button class="btn ghost" type="button" data-act="addsongs">' + icon('plus') + 'Músicas</button></div>';
    if (!tr.length) h += '<div class="empty"><p>Esta playlist ainda não tem músicas.</p></div>';
    else h += '<ul class="list">' + tr.map((t, i) => trackRow(t, i + 1,
      '<button class="ib sm" type="button" data-act="remove" aria-label="Tirar da playlist"><svg class="i" style="transform:rotate(45deg)"><use href="#i-plus"/></svg></button>')).join('') + '</ul>';
    root.innerHTML = h;
    return;
  }
  let h = '<div class="head"><h2>Playlists</h2><button class="btn" type="button" data-act="new">' + icon('plus') + 'Nova</button></div>';
  if (S.plNew) h += '<form class="inline" id="plForm"><input class="search" id="plName" maxlength="40" placeholder="Nome da playlist" aria-label="Nome da playlist" autocomplete="off"><button class="btn" type="submit">Criar</button></form>';
  if (!S.playlists.length) {
    if (!S.plNew) h += '<div class="empty"><p>Cria a tua primeira playlist e junta as músicas que mais ouves.</p></div>';
  } else {
    h += '<ul class="list">' + S.playlists.map(x => '<li><button class="pl" type="button" data-pl="' + x.id + '"><span><b>' + esc(x.name) + '</b><small>' +
      x.ids.filter(byId).length + ' músicas</small></span><svg class="i" style="transform:rotate(180deg)"><use href="#i-back"/></svg></button></li>').join('') + '</ul>';
  }
  root.innerHTML = h;
}
function refreshLists() {
  if (S.tab === 'lib') renderLib();
  else if (S.tab === 'pl' && S.plView && !S.plRename) renderPl();
}
$('plRoot').addEventListener('click', e => {
  const open = e.target.closest('[data-pl]');
  if (open) { S.plView = open.dataset.pl; S.plRename = false; renderPl(); return; }
  const btn = e.target.closest('[data-act]'); if (!btn) return;
  const a = btn.dataset.act; const p = plById(S.plView);
  if (a === 'new') { S.plNew = !S.plNew; renderPl(); const i = $('plName'); if (i) i.focus(); }
  else if (a === 'back') { S.plView = null; S.plRename = false; renderPl(); }
  else if (a === 'rename') { S.plRename = !S.plRename; renderPl(); const i = $('renName'); if (i) { i.focus(); i.select(); } }
  else if (a === 'delpl' && p) {
    if (confirmTap('p' + p.id)) { S.playlists = S.playlists.filter(x => x !== p); S.plView = null; savePl(); renderPl(); toast('Playlist apagada'); }
  }
  else if (a === 'playall' && p) {
    const ids = p.ids.filter(byId);
    if (ids.length) startQueue(ids); else toast('Adiciona músicas primeiro');
  }
  else if (a === 'addsongs' && p) openSheet({ type: 'songs', pl: p.id });
  else if (a === 'remove' || a === 'play') {
    const row = e.target.closest('.row'); if (!row || !p) return;
    const id = row.dataset.id;
    if (a === 'remove') { toggleIn(p.id, id); renderPl(); }
    else if (S.cur === id && audio.src && S.src && p.ids.join() === S.src.join()) toggle();
    else startQueue(p.ids.filter(byId), id);
  }
});
$('plRoot').addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'plForm') {
    const p = createPlaylist($('plName').value);
    if (p) { S.plNew = false; S.plView = p.id; renderPl(); toast('Playlist criada'); }
  } else if (e.target.id === 'renForm') {
    const n = $('renName').value.trim(); const p = plById(S.plView);
    if (n && p) { p.name = n.slice(0, 40); savePl(); S.plRename = false; renderPl(); }
  }
});

/* ---------- Folha (escolher playlist / escolher músicas) ---------- */
function openSheet(s) { S.sheet = s; renderSheet(); }
function closeSheet() { S.sheet = null; renderSheet(); renderPl(); }
function renderSheet() {
  const bg = $('sheetBg'), sh = $('sheet'), s = S.sheet;
  if (!s) { bg.classList.remove('show'); sh.innerHTML = ''; return; }
  let h = '';
  if (s.type === 'track') {
    const t = byId(s.id);
    h += '<h3>Adicionar a playlist</h3>';
    if (t) h += '<p class="note" style="color:var(--mute)">' + esc(t.title) + '</p>';
    h += '<ul class="list">' + S.playlists.map(p => {
      const on = p.ids.includes(s.id);
      return '<li><button class="row' + (on ? ' on' : '') + '" type="button" data-pl="' + p.id + '"><span class="chk">' + (on ? icon('check') : '') +
        '</span><span class="tx"><b>' + esc(p.name) + '</b><small>' + p.ids.filter(byId).length + ' músicas</small></span><span></span></button></li>';
    }).join('') + '</ul>';
    h += '<form class="inline" id="sheetForm" style="margin-top:12px"><input class="search" id="sheetName" maxlength="40" placeholder="Nova playlist" aria-label="Nome da nova playlist" autocomplete="off"><button class="btn" type="submit">Criar</button></form>';
  } else {
    const p = plById(s.pl);
    h += '<h3>Músicas em ' + esc(p ? p.name : '') + '</h3>';
    if (!S.tracks.length) h += '<div class="empty"><p>A biblioteca está vazia.</p></div>';
    else h += '<ul class="list">' + S.tracks.map(t => {
      const on = p && p.ids.includes(t.id);
      return '<li><button class="row' + (on ? ' on' : '') + '" type="button" data-tr="' + t.id + '"><span class="chk">' + (on ? icon('check') : '') +
        '</span><span class="tx"><b>' + esc(t.title) + '</b><small>' + esc(t.artist || '—') + ' · ' + fmt(t.dur) + '</small></span><span></span></button></li>';
    }).join('') + '</ul>';
  }
  h += '<div style="display:flex;justify-content:center;margin-top:14px"><button class="btn" type="button" data-act="close">Feito</button></div>';
  sh.innerHTML = h;
  bg.classList.add('show');
}
$('sheet').addEventListener('click', e => {
  const s = S.sheet; if (!s) return;
  if (e.target.closest('[data-act="close"]')) { closeSheet(); return; }
  const pl = e.target.closest('[data-pl]'), tr = e.target.closest('[data-tr]');
  if (pl && s.type === 'track') { toggleIn(pl.dataset.pl, s.id); renderSheet(); }
  else if (tr && s.type === 'songs') { toggleIn(s.pl, tr.dataset.tr); renderSheet(); }
});
$('sheet').addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id !== 'sheetForm' || !S.sheet) return;
  const p = createPlaylist($('sheetName').value, S.sheet.id);
  if (p) { renderSheet(); toast('Adicionada a ' + p.name); }
});
$('sheetBg').addEventListener('click', e => { if (e.target === $('sheetBg')) closeSheet(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && S.sheet) { closeSheet(); return; }
  if (e.key === ' ' && !/^(INPUT|BUTTON|TEXTAREA|LABEL)$/.test(e.target.tagName)) { e.preventDefault(); toggle(); }
});

/* ---------- Separadores, tema e controlos ---------- */
function setTab(name) {
  S.tab = name;
  ['now', 'lib', 'pl'].forEach(n => { $('v-' + n).hidden = n !== name; });
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === name)));
  $('mini').classList.toggle('show', !!byId(S.cur) && name !== 'now');
  if (name === 'lib') renderLib();
  if (name === 'pl') renderPl();
}
document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => setTab(b.dataset.tab)));

function applySettings() {
  const hil = S.set.skin === 'hilux';
  document.body.classList.toggle('hilux', hil);
  $('brand').textContent = hil ? 'VEM PRÁ HILUX' : 'SIRUBEN MUSIC';
  $('skinTxt').textContent = hil ? 'Hilux' : 'Néon';
  $('skinBtn').setAttribute('aria-pressed', String(hil));
  audio.volume = S.set.vol;
  volEl.value = Math.round(S.set.vol * 100);
  volEl.style.setProperty('--p', volEl.value + '%');
  $('bShuffle').classList.toggle('on', !!S.set.shuffle);
  $('bShuffle').setAttribute('aria-pressed', String(!!S.set.shuffle));
  const r = S.set.repeat;
  $('bRepeat').classList.toggle('on', r !== 'off');
  $('bRepeat').setAttribute('aria-pressed', String(r !== 'off'));
  $('bRepeat').setAttribute('aria-label', r === 'one' ? 'Repetir esta música' : r === 'all' ? 'Repetir tudo' : 'Repetir desligado');
  $('rep1').hidden = r !== 'one';
  applyCover();
  syncVideo();
}
$('skinBtn').addEventListener('click', () => {
  S.set.skin = S.set.skin === 'hilux' ? 'neon' : 'hilux';
  saveSet(); applySettings(); updateNow(); startViz();
  toast(S.set.skin === 'hilux' ? 'Modo Hilux ligado' : 'Modo Néon ligado');
});
$('bPlay').addEventListener('click', toggle);
$('bPrev').addEventListener('click', prev);
$('bNext').addEventListener('click', () => next(false));
$('miniPlay').addEventListener('click', toggle);
$('miniPrev').addEventListener('click', prev);
$('miniNext').addEventListener('click', () => next(false));
$('miniOpen').addEventListener('click', () => setTab('now'));
$('bShuffle').addEventListener('click', () => { S.set.shuffle = !S.set.shuffle; rebuildQueue(); saveSet(); applySettings(); });
$('bRepeat').addEventListener('click', () => {
  S.set.repeat = S.set.repeat === 'off' ? 'all' : S.set.repeat === 'all' ? 'one' : 'off';
  saveSet(); applySettings();
});
$('file').addEventListener('change', e => { const f = e.target.files; if (f && f.length) importFiles(f); e.target.value = ''; });
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', e => { e.preventDefault(); if (e.dataTransfer && e.dataTransfer.files.length) importFiles(e.dataTransfer.files); });

/* ---------- Tema Hilux: imagem do disco e balão ---------- */
let coverUrl = null;
function applyCover() {
  const el = document.querySelector('.label');
  const on = S.set.skin === 'hilux' && !!coverUrl;
  el.classList.toggle('has-img', on);
  el.style.backgroundImage = on ? 'url("' + coverUrl + '")' : '';
  el.style.backgroundSize = on ? 'cover' : '';
  el.style.backgroundPosition = on ? 'center' : '';
  $('coverDel').hidden = !coverUrl;
  $('coverBtnTxt').textContent = coverUrl ? 'Mudar imagem' : 'Imagem do disco';
}
async function loadCover() {
  const b = await get('blobs', 'cover');
  if (b) { coverUrl = URL.createObjectURL(b); applyCover(); }
}
$('coverFile').addEventListener('change', async e => {
  const f = e.target.files && e.target.files[0]; e.target.value = '';
  if (!f) return;
  if (!/^image\//.test(f.type)) { toast('Escolhe uma imagem'); return; }
  await put('blobs', 'cover', f);
  if (coverUrl) URL.revokeObjectURL(coverUrl);
  coverUrl = URL.createObjectURL(f); applyCover(); toast('Imagem do disco guardada');
});
$('coverDel').addEventListener('click', async () => {
  await del('blobs', 'cover');
  if (coverUrl) URL.revokeObjectURL(coverUrl);
  coverUrl = null; applyCover(); toast('Imagem removida');
});
const PHRASES = ['Vem prá Hilux!', 'Bora, meu bem?', 'Segura o chapéu!', 'Pé na estrada!', 'Liga o som!'];
let phraseI = 0;
setInterval(() => {
  if (S.set.skin !== 'hilux' || audio.paused) return;
  phraseI = (phraseI + 1) % PHRASES.length;
  $('bubbleTxt').textContent = PHRASES[phraseI];
}, 4200);

/* ---------- Arranque ---------- */
(async function boot() {
  try { db = await openDB(); persistent = true; } catch (e) { persistent = false; $('storeNote').hidden = false; }
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) { /* ignora */ }
  const [tr, pl, se] = await Promise.all([get('kv', 'tracks'), get('kv', 'playlists'), get('kv', 'settings')]);
  S.tracks = Array.isArray(tr) ? tr : [];
  S.playlists = Array.isArray(pl) ? pl : [];
  Object.assign(S.set, se || {});
  applySettings(); renderLib(); renderPl(); updateNow(); startViz(); loadCover();
})();
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () { /* sem modo offline */ });
  });
}
</script>
</body>
</html>
